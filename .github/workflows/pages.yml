name: demo-pages
on:
  pull_request:
    paths: ['site/**', 'catalog.json', 'demo/**', 'README.md', 'CONTRIBUTING.md', 'tests/**', 'scripts/**', 'docs/**', 'wiki/**', 'packages/**', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['site/**', 'catalog.json', 'demo/**', 'README.md', 'CONTRIBUTING.md', 'tests/**', 'scripts/**', 'docs/**', 'wiki/**', 'packages/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r site/requirements.txt
      - run: python scripts/check_catalog.py
      - run: python scripts/check_docs.py
      - run: python demo/run.py --check
      - run: python -m unittest discover -s tests -v
      - run: node --test site/tests/*.test.mjs
      - run: node --check site/assets/app.mjs
      - run: node --check site/assets/docs.js
      - run: node --check site/assets/redirect.js
      - run: python site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
