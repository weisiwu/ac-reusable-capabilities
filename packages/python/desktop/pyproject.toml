[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "common-tech-framework-desktop"
version = "0.1.0"
description = "Composable desktop application primitives for Python and PyQt5"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
qt = ["PyQt5>=5.15"]
serial = ["pyserial>=3.5"]
test = ["pytest>=8"]
all = ["pytest>=8", "PyQt5>=5.15", "pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
